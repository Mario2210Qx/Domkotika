<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я сделал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', serif;
            font-style: italic;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            z-index: 100;
            transition: opacity 0.3s;
            text-align: center;
            width: 100%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            color: #fff;
        }

        .glass-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 70vh;
            z-index: 10;
        }

        /* ПИВО - ТОЧНО ВНУТРИ СТАКАНА */
        .beer-fill {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 0%;
            background: linear-gradient(to bottom, 
                #FFD700 0%, 
                #FFC700 20%, 
                #FFA500 50%, 
                #FF9500 80%, 
                #FF8C00 100%);
            transition: height 0.15s ease-out;
            z-index: 11;
            /* Форма трапеции - шире сверху */
            clip-path: polygon(12% 0%, 88% 0%, 78% 100%, 22% 100%);
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.6),
                inset 0 -10px 25px rgba(255, 140, 0, 0.8);
        }

        .beer-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.9) 0%, 
                rgba(255, 255, 255, 0.4) 100%);
            border-radius: 50% 50% 0 0;
            filter: blur(2px);
        }

        /* СТАКАН - БОЛЬШОЙ НА ПЕРВОМ ПЛАНЕ */
        .glass-image {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 12;
        }

        .glass-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: screen;
            filter: brightness(1.3) contrast(1.15);
        }

        .beer-stream {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 0;
            background: linear-gradient(90deg, 
                #FF8C00 0%, 
                #FFA500 20%, 
                #FFD700 40%, 
                #FFD700 60%, 
                #FFA500 80%, 
                #FF8C00 100%);
            opacity: 0;
            z-index: 5;
            transition: height 0.1s, opacity 0.3s;
            border-radius: 5px;
            box-shadow: 
                0 0 15px rgba(255, 215, 0, 0.9),
                inset -2px 0 3px rgba(255, 255, 255, 0.8);
        }
