<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я сделал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', serif;
            font-style: italic;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            z-index: 100;
            transition: opacity 0.3s;
            text-align: center;
            width: 100%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .glass-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 55vh;
            z-index: 10;
        }

        .glass {
            width: 100%;
            height: 100%;
            position: relative;
            background: url('glass.png') no-repeat center;
            background-size: contain;
        }

        .beer-container {
            position: absolute;
            bottom: 12%;
            left: 14%;
            width: 72%;
            height: 78%;
            overflow: hidden;
            border-radius: 5px;
        }

        .beer-level {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to bottom, 
                #FFD700 0%, 
                #FFA500 40%, 
                #FF8C00 100%);
            transition: height 0.1s;
            opacity: 0.9;
            box-shadow: 
                inset 0 -10px 30px rgba(255, 140, 0, 0.6),
                inset 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .beer-level::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.7) 0%, 
                rgba(255, 255, 255, 0.3) 50%, 
                rgba(255, 255, 255, 0.1) 100%);
            filter: blur(2px);
        }

        .beer-level::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 10%;
            width: 80%;
            height: 10px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(3px);
        }

        .beer-stream {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 0;
            background: linear-gradient(90deg, 
                #FFA500 0%, 
                #FFD700 20%, 
                #FFD700 50%, 
                #FFA500 80%, 
                #FF8C00 100%);
            opacity: 0;
            z-index: 5;
            transition: height 0.1s, opacity 0.3s;
            border-radius: 5px;
            box-shadow: 
                0 0 8px rgba(255, 215, 0, 0.9),
                0 0 15px rgba(255, 165, 0, 0.7),
                inset -2px 0 3px rgba(255, 255, 255, 0.6),
                inset 2px 0 3px rgba(255, 255, 255, 0.3);
        }

        .beer-stream::before {
            content: '';
            position: absolute;
            top: 0;
            left: 1px;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.9) 0%, 
                rgba(255, 255, 255, 0.4) 50%, 
                rgba(255, 255, 255, 0.9) 100%);
            animation: streamShine 0.5s linear infinite;
        }

        @keyframes streamShine {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 10%;
            position: relative;
            z-index: 20;
        }

        .section-left {
            justify-content: flex-start;
        }

        .section-right {
            justify-content: flex-end;
        }

        .content {
            max-width: 400px;
            font-size: 1.5em;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .content h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #FFD700;
            font-weight: bold;
        }

        .button-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 20;
        }

        .repeat-btn {
            padding: 20px 60px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #9B30FF 0%, #8A2BE2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-style: italic;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(155, 48, 255, 0.5);
        }

        .repeat-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(155, 48, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="header" id="header">я сделал</div>
    
    <div class="beer-stream" id="beerStream"></div>
    
    <div class="glass-container">
        <div class="glass">
            <div class="beer-container">
                <div class="beer-level" id="beerLevel"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="section section-left">
            <div class="content">
                <h2>Обо мне</h2>
                <p>Я Вася и я пью «балтику 0»</p>
            </div>
        </div>

        <div class="section section-right">
            <div class="content">
                <h2>Навыки</h2>
                <p>Я люблю свою семью, хожу на работу и шью сумку из кожи</p>
            </div>
        </div>

        <div class="section section-left">
            <div class="content">
                <h2>Контакты</h2>
                <p>Тел: 6236</p>
            </div>
        </div>

        <div class="button-container">
            <button class="repeat-btn" id="repeatBtn">повтори</button>
        </div>
    </div>

    <script>
        const header = document.getElementById('header');
        const beerLevel = document.getElementById('beerLevel');
        const beerStream = document.getElementById('beerStream');
        const repeatBtn = document.getElementById('repeatBtn');

        window.addEventListener('scroll', () => {
            const scrollPercent = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
            
            // Анимация шапки
            header.style.opacity = 1 - scrollPercent * 3;
            
            // Анимация струи
            if (scrollPercent > 0.05) {
                beerStream.style.opacity = 1;
                beerStream.style.height = (50 - scrollPercent * 50) + 'vh';
            } else {
                beerStream.style.opacity = 0;
                beerStream.style.height = 0;
            }
            
            // Анимация уровня пива (от 0% до 100%)
            beerLevel.style.height = (scrollPercent * 100) + '%';
        });

        repeatBtn.addEventListener('click', () => {
            // Опорожняем стакан
            beerLevel.style.height = '0%';
            beerStream.style.opacity = '0';
            beerStream.style.height = '0';
            header.style.opacity = '1';
            
            // Возвращаемся наверх
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
