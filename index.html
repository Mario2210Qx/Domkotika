<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я сделал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', serif;
            font-style: italic;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            z-index: 100;
            transition: opacity 0.3s;
            text-align: center;
            width: 100%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            color: #fff;
        }

        .glass-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 55vh;
            z-index: 10;
        }

        .glass-image {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 11;
        }

        .glass-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            mix-blend-mode: screen;
        }

        .beer-container {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            height: 80%;
            z-index: 12;
            overflow: hidden;
        }

        .beer-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to bottom, 
                rgba(255, 215, 0, 0.95) 0%, 
                rgba(255, 165, 0, 0.9) 50%, 
                rgba(255, 140, 0, 0.85) 100%);
            transition: height 0.1s;
            box-shadow: 
                inset 0 -5px 15px rgba(255, 140, 0, 0.8),
                inset 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .foam {
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 30px;
            background: linear-gradient(to bottom, 
                rgba(255, 255, 255, 0.95) 0%, 
                rgba(255, 255, 255, 0.8) 50%, 
                rgba(255, 255, 255, 0.6) 100%);
            border-radius: 50% 50% 0 0;
            opacity: 0;
            transition: opacity 0.3s;
            filter: blur(2px);
        }

        .foam::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 10%;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            filter: blur(1px);
        }

        .foam::after {
            content: '';
            position: absolute;
            top: -8px;
            right: 15%;
            width: 15px;
            height: 15px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            filter: blur(1px);
        }

        .beer-stream {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 0;
            background: linear-gradient(90deg, 
                #FF8C00 0%, 
                #FFD700 30%, 
                #FFD700 50%, 
                #FFA500 70%, 
                #FF8C00 100%);
            opacity: 0;
            z-index: 5;
            transition: height 0.1s, opacity 0.3s;
            border-radius: 4px;
            box-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8),
                inset -1px 0 2px rgba(255, 255, 255, 0.7);
        }

        .beer-stream::before {
            content: '';
            position: absolute;
            top: 0;
            left: 1px;
            width: 2px;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            animation: shine 0.5s linear infinite;
        }

        @keyframes shine {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @keyframes foamBubble {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.1); }
        }

        .section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 10%;
            position: relative;
            z-index: 20;
        }

        .section-left {
            justify-content: flex-start;
        }

        .section-right {
            justify-content: flex-end;
        }

        .content {
            max-width: 400px;
            font-size: 1.5em;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .content h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #FFD700;
            font-weight: bold;
        }

        .content p {
            color: #fff;
        }

        .button-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 20;
        }

        .repeat-btn {
            padding: 20px 60px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #9B30FF 0%, #8A2BE2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-style: italic;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(155, 48, 255, 0.5);
        }

        .repeat-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(155, 48, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="header" id="header">я сделал</div>
    
    <div class="beer-stream" id="beerStream"></div>
    
    <div class="glass-wrapper">
        <div class="glass-image">
            <img src="glass.png" alt="Стакан" id="glassImg">
        </div>
        <div class="beer-container">
            <div class="beer-fill" id="beerLevel">
                <div class="foam" id="foam"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="section section-left">
            <div class="content">
                <h2>Обо мне</h2>
                <p>Я Вася и я пью «балтику 0»</p>
            </div>
        </div>

        <div class="section section-right">
            <div class="content">
                <h2>Навыки</h2>
                <p>Я люблю свою семью, хожу на работу и шью сумку из кожи</p>
            </div>
        </div>

        <div class="section section-left">
            <div class="content">
                <h2>Контакты</h2>
                <p>Тел: 6236</p>
            </div>
        </div>

        <div class="button-container">
            <button class="repeat-btn" id="repeatBtn">повтори</button>
        </div>
    </div>

    <script>
        const header = document.getElementById('header');
        const beerLevel = document.getElementById('beerLevel');
        const beerStream = document.getElementById('beerStream');
        const repeatBtn = document.getElementById('repeatBtn');
        const foam = document.getElementById('foam');

        window.addEventListener('scroll', () => {
            const scrollPercent = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
            
            header.style.opacity = Math.max(0, 1 - scrollPercent * 3);
            
            if (scrollPercent > 0.05 && scrollPercent < 0.95) {
                beerStream.style.opacity = 1;
                const streamHeight = Math.min(40, (1 - scrollPercent) * 50);
                beerStream.style.height = streamHeight + 'vh';
            } else {
                beerStream.style.opacity = 0;
            }
            
            const beerHeight = Math.min(scrollPercent * 100, 85);
            beerLevel.style.height = beerHeight + '%';
            
            // Пена появляется когда пиво налито больше 10%
            if (beerHeight > 10) {
                foam.style.opacity = 1;
                foam.style.animation = 'foamBubble 2s ease-in-out infinite';
            } else {
                foam.style.opacity = 0;
                foam.style.animation = 'none';
            }
        });

        repeatBtn.addEventListener('click', () => {
            beerLevel.style.height = '0%';
            beerStream.style.opacity = '0';
            beerStream.style.height = '0';
            foam.style.opacity = '0';
            foam.style.animation = 'none';
            header.style.opacity = '1';
            
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
