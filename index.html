<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я сделал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', serif;
            font-style: italic;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            z-index: 100;
            transition: opacity 0.3s;
            text-align: center;
            width: 100%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            color: #fff;
        }

        .glass-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 60vh;
            z-index: 10;
        }

        .glass-image {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 12;
        }

        .glass-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .beer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 11;
            overflow: hidden;
        }

        .beer-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to bottom, 
                #FFD700 0%, 
                #FFC700 20%, 
                #FFA500 50%, 
                #FF9500 80%, 
                #FF8C00 100%);
            transition: height 0.15s ease-out;
            /* SVG clip-path для точной формы стакана */
            clip-path: url(#glassClip);
        }

        .beer-stream {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 0;
            background: linear-gradient(90deg, 
                #FF8C00 0%, 
                #FFA500 20%, 
                #FFD700 40%, 
                #FFD700 60%, 
                #FFA500 80%, 
                #FF8C00 100%);
            opacity: 0;
            z-index: 5;
            transition: height 0.1s, opacity 0.3s;
            border-radius: 5px;
            box-shadow: 
                0 0 15px rgba(255, 215, 0, 0.9),
                0 0 25px rgba(255, 165, 0, 0.7),
                inset -2px 0 3px rgba(255, 255, 255, 0.8);
        }

        .beer-stream::before {
            content: '';
            position: absolute;
            top: 0;
            left: 2px;
            width: 3px;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 2px;
            animation: streamShine 0.6s linear infinite;
        }

        @keyframes streamShine {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 10%;
            position: relative;
            z-index: 20;
        }

        .section-left {
            justify-content: flex-start;
        }

        .section-right {
            justify-content: flex-end;
        }

        .content {
            max-width: 400px;
            font-size: 1.5em;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .content h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #FFD700;
            font-weight: bold;
        }

        .content p {
            color: #fff;
        }

        .button-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10vh;
            position: relative;
            z-index: 20;
        }

        .repeat-btn {
            padding: 20px 60px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #9B30FF 0%, #8A2BE2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-style: italic;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(155, 48, 255, 0.5);
        }

        .repeat-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(155, 48, 255, 0.7);
        }
    </style>
</head>
<body>
    <!-- SVG определение для clip-path -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <clipPath id="glassClip">
                <!-- Форма стакана: трапеция с расширением кверху -->
                <path d="M 80 50 L 320 50 L 300 550 L 100 550 Z" />
            </clipPath>
        </defs>
    </svg>

    <div class="header" id="header">я сделал</div>
    
    <div class="beer-stream" id="beerStream"></div>
    
    <div class="glass-wrapper">
        <div class="beer-container">
            <div class="beer-fill" id="beerLevel"></div>
        </div>
        <div class="glass-image">
            <img src="glass.png" alt="Стакан" id="glassImg">
        </div>
    </div>

    <div class="container">
        <div class="section section-left">
            <div class="content">
                <h2>Обо мне</h2>
                <p>Я Вася и я пью «балтику 0»</p>
            </div>
        </div>

        <div class="section section-right">
            <div class="content">
                <h2>Навыки</h2>
                <p>Я люблю свою семью, хожу на работу и шью сумку из кожи</p>
            </div>
        </div>

        <div class="section section-left">
            <div class="content">
                <h2>Контакты</h2>
                <p>Тел: 6236</p>
            </div>
        </div>

        <div class="button-container">
            <button class="repeat-btn" id="repeatBtn">повтори</button>
        </div>
    </div>

    <script>
        const header = document.getElementById('header');
        const beerLevel = document.getElementById('beerLevel');
        const beerStream = document.getElementById('beerStream');
        const repeatBtn = document.getElementById('repeatBtn');

        window.addEventListener('scroll', () => {
            const scrollPercent = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
            
            header.style.opacity = Math.max(0, 1 - scrollPercent * 3);
            
            if (scrollPercent > 0.05 && scrollPercent < 0.95) {
                beerStream.style.opacity = 1;
                const streamHeight = Math.min(40, (1 - scrollPercent) * 50);
                beerStream.style.height = streamHeight + 'vh';
            } else {
                beerStream.style.opacity = 0;
            }
            
            const beerHeight = Math.min(scrollPercent * 100, 90);
            beerLevel.style.height = beerHeight + '%';
        });

        repeatBtn.addEventListener('click', () => {
            beerLevel.style.height = '0%';
            beerStream.style.opacity = '0';
            beerStream.style.height = '0';
            header.style.opacity = '1';
            
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
