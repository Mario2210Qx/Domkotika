    <title>Я сделал</title>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;

            font-style: italic;
            overflow-x: hidden;

        .header {

            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            z-index: 100;
            transition: opacity 0.3s;
            text-align: center;
            width: 100%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            color: #fff;
        }

        .glass-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 55vh;
            z-index: 10;
        }

        .glass-image {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 11;
        }

        .glass-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* УБИРАЕМ БЕЛЫЙ ФОН */
            filter: brightness(1.2) contrast(1.1);
        }

            bottom: 10%;

            overflow: hidden;
        }
